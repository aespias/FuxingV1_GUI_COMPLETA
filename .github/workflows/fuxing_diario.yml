name: Fuxing Bonoloto Diario

on:
  schedule:
    - cron: '0 23 * * *'
      timezone: 'Europe/Madrid'
  workflow_dispatch:

jobs:
  ejecutar-fuxing:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Fuxing (modo consola, sin GUI)
        run: |
          python Fuxing_Pausa.py --console
        env:
          PYTHONUNBUFFERED: '1'

      - name: Guardar resultados en el repositorio
        if: always()
        run: |
          git config user.name "Fuxing Bot"
          git config user.email "fuxing-bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Resultados Fuxing $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
